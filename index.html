<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>診察室 - 360°バーチャルツアー demo</title>
<meta name="description" content="診察室 - 360°バーチャルツアー demo." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="lib/pannellum.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <div id="panorama" role="application" aria-label="Panorama 360 derajat, seret untuk melihat sekeliling"></div>

  <div id="loading-screen">
    <div class="loading-ring" aria-hidden="true"></div>
    <p>パノラマを読み込み中…</p>
  </div>

  <header class="hud-top">
    <p class="eyebrow">バーチャルツアー · 360°</p>
    <h1 id="scene-title">診察室</h1>
  </header>

  <button id="fullscreen-btn" class="control-btn" aria-label="全画面" title="全画面">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
    </svg>
  </button>

  <!-- ============ Floorplan (bottom-right) ============ -->
  <div class="nav-panel">
    <div class="floorplan-panel" id="floorplan-panel">
      <div class="floorplan-header">
        <p class="floorplan-title">平面図</p>
        <button id="floorplan-hide-btn" class="icon-btn" aria-label="平面図を隠す" title="平面図を隠す">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="floor-tabs" id="floor-tabs" role="tablist" aria-label="階を選択"></div>

      <div class="floorplan-viewport" id="floorplan-viewport">
        <div class="floorplan-canvas" id="floorplan-canvas">
          <img id="floorplan-img" src="assets/floorplan.jpg" alt="1階の平面図と視点" draggable="false" />
          <!-- viewpoint dots are injected by js/app.js -->
        </div>
      </div>

      <div class="floorplan-zoom-controls">
        <button type="button" id="zoom-out-btn" class="zoom-btn" aria-label="縮小" title="縮小">−</button>
        <button type="button" id="zoom-reset-btn" class="zoom-btn zoom-reset" aria-label="ズームをリセット" title="リセット">1×</button>
        <button type="button" id="zoom-in-btn" class="zoom-btn" aria-label="拡大" title="拡大">+</button>
      </div>
    </div>

    <button id="floorplan-show-btn" class="icon-btn floorplan-show-btn" aria-label="平面図を表示" title="平面図を表示">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 3v18M3 9h6"/>
      </svg>
    </button>
  </div>

  <!-- ============ Comments (bottom-left) ============ -->
  <div class="comment-nav">
    <div class="comment-panel" id="comment-panel">
      <div class="comment-panel-header">
        <p class="floorplan-title">コメント</p>
        <div class="comment-header-actions">
          <button type="button" id="comment-fab" class="icon-btn" aria-label="コメントを追加" title="コメントを追加">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <button type="button" id="comment-hide-btn" class="icon-btn" aria-label="コメントを隠す" title="コメントを隠す">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="comment-list" id="comment-list"></div>
      <p class="comment-empty" id="comment-empty">まだコメントはありません</p>

      <!-- Compose / edit form -->
      <form class="comment-form" id="comment-form">
        <p class="comment-form-title" id="comment-form-title">新しいコメント</p>

        <input type="text" id="comment-name" class="comment-input" placeholder="お名前（任意・匿名可）" maxlength="40" />

        <select id="comment-type" class="comment-input">
          <option value="text">💬 テキスト</option>
          <option value="link">🔗 リンク</option>
          <option value="video">🎬 動画</option>
          <option value="image">🖼️ 画像</option>
        </select>

        <textarea id="comment-content" class="comment-input" rows="3" placeholder="コメントを入力…" maxlength="1000"></textarea>

        <label class="comment-pin-label">
          <input type="checkbox" id="comment-pin-toggle" />
          <span>📍 360°ビューにピンを追加</span>
        </label>
        <p class="comment-pin-hint">送信後、パノラマ内をクリックして位置を指定します。</p>

        <div class="comment-form-actions">
          <button type="button" id="comment-cancel-btn" class="comment-btn ghost">キャンセル</button>
          <button type="submit" id="comment-submit-btn" class="comment-btn primary">送信</button>
        </div>
      </form>
    </div>

    <button id="comment-show-btn" class="icon-btn comment-show-btn" aria-label="コメントを表示" title="コメントを表示">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
  </div>

  <!-- ============ Placement mode banner ============ -->
  <div class="placement-banner" id="placement-banner">
    <span>パノラマ内をクリックしてピンを配置</span>
    <button type="button" id="placement-cancel-btn">キャンセル</button>
  </div>

  <!-- ============ Comment content modal ============ -->
  <div class="comment-modal" id="comment-modal">
    <div class="comment-modal-card">
      <button type="button" class="comment-modal-close" id="comment-modal-close" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <div id="comment-modal-body"></div>
    </div>
  </div>

</div>

<script src="lib/pannellum.js"></script>
<script src="js/app.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/comments.js"></script>
</body>
</html>
