<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>診察室 - 360°バーチャルツアー demo</title>
<meta name="description" content="診察室 - 360°バーチャルツアー demo." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="lib/pannellum.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <div id="panorama" role="application" aria-label="Panorama 360 derajat, seret untuk melihat sekeliling"></div>

  <div id="loading-screen">
    <div class="loading-ring" aria-hidden="true"></div>
    <p>パノラマを読み込み中…</p>
  </div>

  <header class="hud-top">
    <p class="eyebrow">バーチャルツアー · 360°</p>
    <h1 id="scene-title">診察室</h1>
  </header>

  <button id="fullscreen-btn" class="control-btn" aria-label="全画面" title="全画面">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
    </svg>
  </button>

  <div class="nav-panel">
    <div class="floorplan-panel">
      <p class="floorplan-title">平面図</p>
      <div class="floorplan-wrap" id="floorplan-wrap">
        <img src="assets/floorplan.jpg" alt="Denah ruangan dengan titik pandang" draggable="false" />
        <!-- viewpoint dots are injected by js/app.js from the scenes list -->
      </div>
    </div>
  </div>

</div>

<script src="lib/pannellum.js"></script>
<script src="js/app.js"></script>
</body>
</html>
